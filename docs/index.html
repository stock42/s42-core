<!doctype html>
<html
	lang="en"
	data-default-lang="en"
	data-theme="light"
>
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			name="theme-color"
			content="#f7f8fb"
		/>
		<title>S42-Core Documentation</title>
		<meta
			name="description"
			content="Example-first documentation for S42-Core, the Bun-first modular backend framework."
		/>
		<link
			rel="canonical"
			href="https://s42core.com/"
		/>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="./apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="./favicon-16x16.png"
		/>
		<link
			rel="manifest"
			href="./site.webmanifest"
		/>
		<link
			rel="icon"
			href="./favicon.ico"
		/>

		<meta
			property="og:title"
			content="S42-Core Documentation"
		/>
		<meta
			property="og:description"
			content="Build modular Bun backends through practical examples and source-aligned API references."
		/>
		<meta
			property="og:image"
			content="https://s42core.com/logo.png"
		/>
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:url"
			content="https://s42core.com/"
		/>
		<meta
			name="twitter:card"
			content="summary"
		/>

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const storedTheme = window.localStorage.getItem('s42-docs-theme')
				document.documentElement.dataset.theme =
					storedTheme === 'light' || storedTheme === 'dark' ? storedTheme
					: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark'
					: 'light'
			} catch {
				document.documentElement.dataset.theme = 'light'
			}
		</script>
		<link
			rel="stylesheet"
			href="./styles.css"
		/>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
		></script>
		<script
			defer
			src="./app.js"
		></script>
	</head>
	<body>
		<a
			class="skip-link"
			href="#main-content"
			>Skip to documentation</a
		>

		<header class="topbar">
			<div class="topbar__inner">
				<button
					id="menu-toggle"
					class="icon-button mobile-only"
					type="button"
					aria-label="Open documentation menu"
					aria-controls="docs-sidebar"
					aria-expanded="false"
				>
					<svg
						aria-hidden="true"
						viewBox="0 0 24 24"
					>
						<path d="M4 7h16M4 12h16M4 17h16" />
					</svg>
				</button>

				<a
					class="brand"
					href="./?doc=GETTING_STARTED"
					data-doc-link="GETTING_STARTED"
				>
					<img
						src="./logo.png"
						alt=""
						width="34"
						height="34"
					/>
					<span class="brand__name">S42-Core</span>
					<span class="version-badge">v3.0.11</span>
				</a>

				<button
					id="search-trigger"
					class="search-trigger"
					type="button"
				>
					<svg
						aria-hidden="true"
						viewBox="0 0 24 24"
					>
						<circle
							cx="11"
							cy="11"
							r="7"
						/>
						<path d="m16.2 16.2 4 4" />
					</svg>
					<span data-i18n="search.trigger">Search documentation</span>
					<kbd><span class="platform-key">Ctrl</span> K</kbd>
				</button>

				<div class="topbar__actions">
					<a
						class="header-link desktop-only"
						href="https://github.com/stock42/s42-core"
						target="_blank"
						rel="noreferrer"
					>
						GitHub
						<svg
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<path d="M7 17 17 7M8 7h9v9" />
						</svg>
					</a>

					<div
						class="language-switch"
						role="group"
						aria-label="Documentation language"
					>
						<button
							id="lang-en"
							type="button"
							data-lang="en"
						>
							EN
						</button>
						<button
							id="lang-es"
							type="button"
							data-lang="es"
						>
							ES
						</button>
					</div>

					<button
						id="theme-toggle"
						class="icon-button"
						type="button"
						aria-label="Switch color theme"
					>
						<svg
							class="theme-icon theme-icon--sun"
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<circle
								cx="12"
								cy="12"
								r="4"
							/>
							<path
								d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
							/>
						</svg>
						<svg
							class="theme-icon theme-icon--moon"
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<path d="M20 15.7A8.5 8.5 0 0 1 8.3 4 8.5 8.5 0 1 0 20 15.7Z" />
						</svg>
					</button>
				</div>
			</div>
		</header>

		<div
			id="sidebar-backdrop"
			class="sidebar-backdrop"
			hidden
		></div>

		<div class="docs-layout">
			<aside
				id="docs-sidebar"
				class="sidebar"
				aria-label="Documentation navigation"
			>
				<div class="sidebar__intro">
					<p
						class="eyebrow"
						data-i18n="sidebar.eyebrow"
					>
						Documentation
					</p>
					<p data-i18n="sidebar.description">
						Practical examples first. Exact contracts when you need them.
					</p>
				</div>
				<nav id="docs-navigation"></nav>
				<div class="sidebar__footer">
					<a
						href="https://github.com/stock42/s42-core/issues"
						target="_blank"
						rel="noreferrer"
					>
						<span data-i18n="sidebar.feedback">Documentation feedback</span>
						<svg
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<path d="M7 17 17 7M8 7h9v9" />
						</svg>
					</a>
				</div>
			</aside>

			<main
				id="main-content"
				class="main-content"
				tabindex="-1"
			>
				<div class="article-shell">
					<nav
						class="breadcrumbs"
						aria-label="Breadcrumb"
					>
						<a
							href="./?doc=GETTING_STARTED"
							data-doc-link="GETTING_STARTED"
							>Docs</a
						>
						<svg
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<path d="m9 18 6-6-6-6" />
						</svg>
						<span id="breadcrumb-category"></span>
						<svg
							aria-hidden="true"
							viewBox="0 0 24 24"
						>
							<path d="m9 18 6-6-6-6" />
						</svg>
						<span
							id="breadcrumb-document"
							aria-current="page"
						></span>
					</nav>

					<div
						id="fallback-notice"
						class="notice"
						role="status"
						hidden
					></div>

					<article
						id="document-content"
						class="markdown-body"
						aria-live="polite"
					>
						<div
							class="document-loading"
							role="status"
						>
							<span class="loading-bar"></span>
							<span class="loading-bar loading-bar--short"></span>
							<span class="loading-block"></span>
						</div>
					</article>

					<nav
						id="document-pagination"
						class="document-pagination"
						aria-label="Adjacent documentation"
					></nav>

					<footer class="article-footer">
						<p data-i18n="footer.source">
							Documentation generated from repository Markdown.
						</p>
						<a
							id="edit-link"
							target="_blank"
							rel="noreferrer"
						>
							<span data-i18n="footer.edit">View source on GitHub</span>
							<svg
								aria-hidden="true"
								viewBox="0 0 24 24"
							>
								<path d="M7 17 17 7M8 7h9v9" />
							</svg>
						</a>
					</footer>
				</div>
			</main>

			<aside
				class="toc"
				aria-label="On this page"
			>
				<p
					class="toc__title"
					data-i18n="toc.title"
				>
					On this page
				</p>
				<nav id="table-of-contents"></nav>
			</aside>
		</div>

		<dialog
			id="search-dialog"
			class="search-dialog"
			aria-labelledby="search-title"
		>
			<div class="search-panel">
				<div class="search-panel__header">
					<svg
						aria-hidden="true"
						viewBox="0 0 24 24"
					>
						<circle
							cx="11"
							cy="11"
							r="7"
						/>
						<path d="m16.2 16.2 4 4" />
					</svg>
					<label
						id="search-title"
						class="sr-only"
						for="search-input"
						>Search documentation</label
					>
					<input
						id="search-input"
						type="search"
						autocomplete="off"
						spellcheck="false"
						placeholder="Search examples, methods, concepts…"
					/>
					<button
						id="search-close"
						class="search-close"
						type="button"
						aria-label="Close search"
					>
						<kbd>Esc</kbd>
					</button>
				</div>
				<p
					id="search-status"
					class="search-status"
					aria-live="polite"
				></p>
				<div
					id="search-results"
					class="search-results"
					role="listbox"
				></div>
				<div class="search-panel__footer">
					<span
						><kbd>↑</kbd><kbd>↓</kbd>
						<span data-i18n="search.navigate">Navigate</span></span
					>
					<span><kbd>↵</kbd> <span data-i18n="search.open">Open</span></span>
				</div>
			</div>
		</dialog>

		<div
			id="copy-status"
			class="sr-only"
			aria-live="polite"
		></div>
		<noscript>
			<div class="noscript">
				This documentation viewer requires JavaScript to render local Markdown files.
			</div>
		</noscript>
	</body>
</html>
